openapi: 3.1.0
info:
  title: Telephone-Booth Operator API
  description: |
    Versioned REST + WebSocket API between the operator console
    (`Telephone-Booth-Operator`) and the phone-side Rust client.

    The phone client authenticates with a static Bearer API token issued from
    the operator UI. Operator browser sessions authenticate via Authentik OIDC
    (cookie session). Native mobile apps in
    `Telephone-Booth-Operator-Mobile` authenticate with Authentik PKCE and send
    the resulting access token as `Authorization: Bearer <jwt>`
    (`operatorBearer` security scheme).
  version: 1.0.0
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8787
    description: Local dev
  - url: https://operator.example.com
    description: Production
tags:
  - name: status
  - name: questions
  - name: messages
  - name: uploads
  - name: auth
  - name: tokens
  - name: transcriptions
  - name: moderations
  - name: stats
  - name: monitor
  - name: installations
  - name: worker
  - name: message-processing
  - name: audit
paths:
  /healthz:
    get:
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/status:
    get:
      summary: Current booth status in an installation scope.
      tags: [status]
      security:
        - operatorSession: []
        - operatorBearer: []
        - apiToken: []
      parameters:
        - name: installationId
          in: query
          description: |
            Installation scope. Omit for the currently active installation
            (the default), pass a uuid for a historical one, or `all` to span
            every installation.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, enum: [all] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoothStatus" }
    put:
      summary: Phone client posts a status update.
      tags: [status]
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusUpdate" }
      responses:
        "204": { description: accepted }

  /v1/status/history:
    get:
      summary: Recent booth status snapshots for operator charts.
      tags: [status]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: installationId
          in: query
          description: |
            Installation scope. Omit for the currently active installation
            (the default), pass a uuid for a historical one, or `all` to span
            every installation.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, enum: [all] }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusHistory" }

  /v1/questions:
    get:
      summary: List questions for management (drafts + active by default).
      tags: [questions]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: status
          in: query
          description: |
            Filter to a single lifecycle state. Omit to list every non-archived
            question, or pass `any` to include archived ones — needed to resolve
            the prompts of messages from an installation that has ended, whose
            questions were archived by the rollover.
          schema:
            oneOf:
              - $ref: "#/components/schemas/QuestionStatus"
              - type: string
                enum: [any]
        - name: ids
          in: query
          description: |
            Comma-separated question ids (max 200). When present this is the
            whole filter: every named question is returned regardless of
            installation scope, status, `limit` or `cursor`, so a caller can
            resolve the prompts of messages it is already showing in one call.
            `nextCursor` is always null for such a request.
          schema: { type: string }
        - name: installationId
          in: query
          description: |
            Installation scope. Omit for the currently active installation
            (the default), pass a uuid for a historical one, or `all` to span
            every installation.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, enum: [all] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionList" }
    post:
      summary: Create a new question from an already-uploaded audio file.
      tags: [questions]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "404": { description: audio file not found }
        "409": { description: duplicate prompt or audio already attached }
        "503": { description: no installation was open to file the prompt under }

  /v1/questions/random:
    get:
      summary: A random active question for the phone client to play.
      tags: [questions]
      security:
        - apiToken: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "404": { description: no questions available }

  /v1/questions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Archive a question (soft-delete; stops the booth offering it).
      tags: [questions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "204": { description: removed }
        "404": { description: not found }
        "409": { description: the question's installation has ended }

  /v1/questions/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Activate a question so the booth offers it to callers.
      tags: [questions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "404": { description: not found }
        "409": { description: the question's installation has ended }

  /v1/questions/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Move a question back to draft so the booth stops offering it.
      tags: [questions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "404": { description: not found }
        "409": { description: the question's installation has ended }

  /v1/instructions:
    get:
      summary: List instruction clips for management.
      tags: [instructions]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: status
          in: query
          description: Filter to a single lifecycle state.
          schema: { $ref: "#/components/schemas/InstructionStatus" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstructionList" }
    post:
      summary: Create a new instruction from an already-uploaded audio file.
      tags: [instructions]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstructionCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instruction" }
        "404": { description: audio file not found }
        "409": { description: audio already attached }

  /v1/instructions/random:
    get:
      summary: A random active instruction clip for the phone client to play.
      tags: [instructions]
      security:
        - apiToken: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instruction" }
        "404": { description: no instructions available }

  /v1/instructions/current:
    get:
      summary: Compatibility alias for a random active instruction clip.
      deprecated: true
      tags: [instructions]
      security:
        - apiToken: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instruction" }
        "404": { description: no instructions available }

  /v1/instructions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update an instruction clip's description.
      tags: [instructions]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstructionUpdate" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instruction" }
        "404": { description: not found }
    delete:
      summary: Delete an instruction clip.
      tags: [instructions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "204": { description: removed }
        "404": { description: not found }

  /v1/instructions/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Activate an instruction clip so the booth can fetch it.
      tags: [instructions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instruction" }
        "404": { description: not found }

  /v1/instructions/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Deactivate an instruction clip so the booth stops fetching it.
      tags: [instructions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instruction" }
        "404": { description: not found }

  /v1/messages:
    get:
      summary: List messages, filterable by status and creation time.
      tags: [messages]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: installationId
          in: query
          description: |
            Installation scope. Omit for the currently active installation
            (the default), pass a uuid for a historical one, or `all` to span
            every installation.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, enum: [all] }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MessageStatus" }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
    post:
      summary: Initiate a message audio upload.
      tags: [messages]
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageCreate" }
      responses:
        "201":
          description: >-
            Upload URL issued. Also returned when re-initiating an existing
            message that is still `uploading` (e.g. the booth retried after a
            reboot): the same message id and a fresh SAS are handed back so the
            upload can resume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageInitiated" }
        "404": { description: question not found }
        "409":
          description: >-
            Conflicting audio hash: the matching message has already advanced
            past `uploading`, the retry targets a different question, or the
            hash belongs to a non-message file.

  /v1/messages/random:
    get:
      summary: A random approved message for the phone client to play.
      tags: [messages]
      security:
        - apiToken: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { description: no approved messages available }

  /v1/messages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Fetch one message.
      tags: [messages]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { description: not found }
    delete:
      summary: Delete a message row.
      description: >-
        Refuses a message belonging to an ended installation: that era's
        counters were frozen at close-out and deleting a row would leave the
        summary disagreeing with its own drill-down.
      tags: [messages]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "204": { description: deleted }
        "404": { description: not found }
        "409": { description: the message's installation has ended }

  /v1/messages/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Phone client notifies that the direct blob upload finished.
      description: |
        Verifies the uploaded blob and moves the message from `uploading`
        straight to `pending`, i.e. into the operator review queue.
        Transcription is optional enrichment pushed in later by the external
        Transcription app, so it never gates whether a landed recording is
        reviewable.
      tags: [messages]
      security:
        - apiToken: []
      responses:
        "200":
          description: upload accepted; message queued for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageComplete" }
        "404": { description: not found }
        "409": { description: blob not found }
        "413": { description: audio blob exceeds maximum allowed size }
        "422": { description: "sha256 metadata missing or mismatch" }

  /v1/messages/{id}/transcriptions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List all transcription attempts for a message (newest first).
      tags: [transcriptions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptionList" }
        "404": { description: message not found }

  /v1/messages/{id}/transcribe:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Re-run transcription (and downstream moderation) for a message.
      description: |
        Runs the full pipeline synchronously — transcription, then
        moderation against the new transcript, then any configured
        auto-decision — and returns the resulting `Transcription` row.
        The same row (plus the matching `Message` update) is also
        broadcast on `/v1/ws/status` as a `{kind:"message"}` envelope so
        other clients pick up the change without polling. The status is
        `202` to signal that the row may still be of interest to other
        listeners (history queries, the moderation row, the parent
        `Message`), even though the synchronous work is finished.
      tags: [transcriptions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "202":
          description: transcription attempt recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcription" }
        "404": { description: message not found }

  /v1/messages/{id}/transcription:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Submit an operator-authored transcript for a message.
      description: |
        Lets a logged-in operator record transcript text directly — for
        example the iOS Transcriber app doing on-device transcription — rather
        than triggering the server-side pipeline via `/transcribe`. Mirrors the
        worker push-back callback semantics: a pending transcription row is
        finalized, otherwise a new succeeded row is recorded (a redelivery of
        the latest succeeded transcript — same `text`, `language`, `model` and
        submitter — is a no-op, while a correction records a new row). The row is
        attributed to the submitting operator (`requestedById`) and stamped
        with provider `on_device`. By default the server still translates and
        moderates the text; clients submitting their own complete local result
        set `processDownstream: false` to prevent any downstream provider
        call. `text` may be empty for a silent recording. The resulting
        `Transcription` row is returned and broadcast on `/v1/ws/status` as a
        `{kind:"message"}` envelope.
      tags: [transcriptions]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 20000 }
                expectedLatestTranscriptionId:
                  type: [string, "null"]
                  format: uuid
                  description: >-
                    Latest transcription observed by the client. When present,
                    the write is rejected if that snapshot has changed.
                expectedLatestTranscriptionSha256:
                  type: [string, "null"]
                  pattern: "^[0-9a-fA-F]{64}$"
                  description: >-
                    SHA-256 of the observed latest transcription status, a
                    newline, and its ECMAScript-trimmed text. Null represents
                    no latest transcription. When present, the write is
                    rejected if the row changed even when its ID is unchanged.
                language: { type: [string, "null"], minLength: 1, maxLength: 64 }
                model: { type: [string, "null"], minLength: 1, maxLength: 128 }
                processDownstream: { type: boolean, default: true }
      responses:
        "202":
          description: transcription recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcription" }
        "404": { description: message not found }
        "409": { description: latest transcription snapshot changed }

  /v1/messages/{id}/moderate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Re-run moderation against the latest succeeded transcription.
      description: |
        Runs the moderation step (and any configured auto-decision)
        synchronously against the latest succeeded transcription and
        returns the resulting `Moderation` row. The same row is also
        broadcast on `/v1/ws/status` as a `{kind:"message"}` envelope.
      tags: [moderations]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "202":
          description: moderation attempt recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moderation" }
        "404": { description: message not found }
        "409": { description: no succeeded transcription available to moderate }

  /v1/messages/{id}/moderation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Submit an operator-computed moderation verdict for a message.
      description: |
        Lets a logged-in operator record a moderation verdict their own
        device computed locally — for example the iOS review app running
        Apple Intelligence — rather than asking the server to re-run
        moderation through the configured upstream via `/moderate`. Mirrors
        the worker push-back callback semantics: a pending moderation row is
        finalized, otherwise a new succeeded row is recorded (an exact
        redelivery of the latest succeeded verdict from the same submitter is
        a no-op). The row is attributed to the submitting operator
        (`requestedById`) and stamped with provider `on_device` so clients can
        label it. The verdict is advisory only: it surfaces the message for
        review but never decides it — `POST /v1/messages/{id}/decision`
        remains the only thing that does. The resulting `Moderation` row is
        returned and broadcast on `/v1/ws/status` as a `{kind:"message"}`
        envelope.
      tags: [moderations]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flagged, recommendation, maxScore]
              oneOf:
                - properties:
                    transcriptionId: { type: "null" }
                    inputSha256: false
                - required: [transcriptionId, inputSha256]
                  properties:
                    transcriptionId: { type: string, format: uuid }
                    inputSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
              properties:
                transcriptionId: { type: [string, "null"], format: uuid }
                inputSha256:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
                  description: >-
                    SHA-256 of the ECMAScript-trimmed transcript or translation
                    moderated; required when transcriptionId is supplied.
                flagged: { type: boolean }
                recommendation: { $ref: "#/components/schemas/ModerationRecommendation" }
                maxScore: { type: number, minimum: 0, maximum: 1 }
                categories:
                  type: object
                  additionalProperties: { type: number }
                reasonSummary: { type: [string, "null"], maxLength: 2000 }
                model: { type: [string, "null"], minLength: 1, maxLength: 128 }
      responses:
        "202":
          description: moderation verdict recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moderation" }
        "404": { description: message or transcription not found }
        "409": { description: moderation input no longer matches the transcription }

  /v1/messages/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Record a human moderation decision (approve or reject).
      description: |
        Lets a logged-in operator override (or stand in for) the AI
        pipeline by approving or rejecting a message. Sets the message
        `status`, `decidedAt`, and `decidedById`, and optionally replaces
        `notes`. Only valid once the recording has landed — a message that
        is still `uploading` returns `409`, as does one belonging to an
        installation that has ended — those counters are frozen.
      tags: [messages]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                notes: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { description: message not found }
        "409":
          description: >-
            the message is still uploading, or its installation has ended and
            its counters are frozen

  /v1/messages/{id}/translation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Attach a translation to a succeeded transcription.
      description: |
        Without `transcriptionId`, records a human English correction on the
        latest succeeded transcription with null provider/model.
        `expectedTranscriptionId` conditionally targets that human correction
        without changing its provenance. `expectedTranslationSha256` binds
        either form to the translation content the client observed. With
        `transcriptionId`, requires that row to still be latest and records an
        on-device generated translation with provider `on_device` and its
        optional model. Moderation is invalidated only when the effective
        reviewed text changes.
        Returns `409` when no succeeded transcription exists or the targeted
        transcription has been superseded.
      tags: [messages]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translatedText]
              properties:
                transcriptionId: { type: string, format: uuid }
                expectedTranscriptionId:
                  type: string
                  format: uuid
                  description: >-
                    Latest transcription observed while editing a human
                    correction; rejected if it is no longer latest.
                expectedTranslationSha256:
                  type: [string, "null"]
                  pattern: "^[a-f0-9]{64}$"
                  description: >-
                    SHA-256 of the trimmed translation observed by the client,
                    or null when no succeeded translation existed.
                translatedText: { type: string, minLength: 1, maxLength: 20000 }
                translatedLanguage: { type: string, minLength: 1, maxLength: 64 }
                model: { type: [string, "null"], minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: translation recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcription" }
        "404": { description: message not found }
        "409":
          { description: "no succeeded transcription, or stale transcription or translation input" }

  /v1/uploads/sas:
    post:
      summary: Request a presigned Azure Blob upload URL.
      tags: [uploads]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSasRequest" }
      responses:
        "201":
          description: upload slot issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSlot" }

  /v1/stats/summary:
    get:
      summary: Aggregated booth status + queue counters for mobile widgets.
      description: |
        Cached aggregation suitable for high-frequency widget polling.
        Returns the latest booth status, message-queue counts (pending,
        received-today, latest id), call counts (today + in-progress), and
        the active WebSocket subscriber count. Cached for 5 seconds on the
        server so 1 request per 15s widget timeline ≈ 0 extra DB load.
      tags: [stats]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: installationId
          in: query
          description: |
            Installation scope. Omit for the currently active installation
            (the default), pass a uuid for a historical one, or `all` to span
            every installation.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, enum: [all] }
      responses:
        "200":
          description: aggregated booth statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsSummary" }
        "401": { description: missing or invalid credentials }

  /v1/monitor/summary:
    get:
      summary: Least-privilege counters for the physical booth monitor.
      description: |
        Returns aggregate call and message counts for today and for the active
        installation overall. Calendar-day boundaries use the requested IANA
        time zone.
      tags: [monitor]
      security:
        - apiToken: []
      parameters:
        - name: timeZone
          in: query
          description: IANA time zone used to determine local midnight.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            default: America/Toronto
      responses:
        "200":
          description: current local-day and overall counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorSummary" }
        "400": { description: invalid time zone }
        "401": { description: missing or invalid credentials }
        "403": { description: API token does not have monitor scope }

  /v1/stats/overview:
    get:
      summary: Historical usage aggregation over a time window or custom range.
      description: |
        Thorough aggregates across calls, messages, booth events and uploads.
        Select either a preset `window`, or a custom range via `start`/`end`.
        `end` accepts the literal `now` (or omit it) to mean the current
        instant, so a saved custom filter stays live. Preset windows are
        cached; custom ranges are computed fresh.
      tags: [stats]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: installationId
          in: query
          description: |
            Installation scope. Omit for the currently active installation
            (the default), pass a uuid for a historical one, or `all` to span
            every installation.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, enum: [all] }
        - name: window
          in: query
          schema: { $ref: "#/components/schemas/StatsWindow" }
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          description: An ISO timestamp, or the literal "now".
          schema:
            anyOf:
              - { type: string, format: date-time }
              - { type: string, enum: [now] }
      responses:
        "200":
          description: aggregated usage statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsOverview" }
        "400": { description: invalid window or range }
        "401": { description: missing or invalid credentials }

  /v1/stats/filters:
    get:
      summary: List the current operator's saved metric filters.
      tags: [stats]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: saved filters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MetricFilter" }
        "401": { description: missing or invalid credentials }
    post:
      summary: Save a new metric filter for the current operator.
      tags: [stats]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricFilterInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricFilter" }
        "400": { description: invalid selection }
        "401": { description: missing or invalid credentials }

  /v1/stats/filters/{id}:
    get:
      summary: Fetch one of the current operator's saved filters.
      tags: [stats]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: the saved filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricFilter" }
        "401": { description: missing or invalid credentials }
        "404": { description: not found or not owned by the caller }
    put:
      summary: Replace one of the current operator's saved filters.
      tags: [stats]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricFilterInput" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricFilter" }
        "400": { description: invalid selection }
        "401": { description: missing or invalid credentials }
        "404": { description: not found or not owned by the caller }
    delete:
      summary: Delete one of the current operator's saved filters.
      tags: [stats]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: deleted }
        "401": { description: missing or invalid credentials }
        "404": { description: not found or not owned by the caller }

  /v1/audit-logs:
    get:
      summary: List audit-trail entries (admin only, cursor-paginated).
      description: |
        Append-only record of every write action taken against the API: who
        performed it, from which IP, when, and with what outcome. Booth
        telemetry heartbeats are excluded unless `AUDIT_LOG_TELEMETRY=true`.
        There is deliberately no write surface — entries are created by the
        server and aged out by `AUDIT_LOG_RETENTION_DAYS`.
      tags: [audit]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: action
          in: query
          description: >-
            Action prefix. `message.` matches the whole family, `message.approve`
            just approvals, `auth.login` also its denied and failed variants.
          schema: { type: string }
        - name: actorType
          in: query
          schema: { type: string, enum: [operator, apiToken, anonymous, system] }
        - name: actorUserId
          in: query
          schema: { type: string }
        - name: targetType
          in: query
          schema: { type: string }
        - name: targetId
          in: query
          schema: { type: string }
        - name: ip
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "400": { description: invalid cursor }
        "401": { description: not authenticated }
        "403": { description: operator admin privileges required }
  /v1/audit-logs/targets/{targetType}/{targetId}:
    parameters:
      - { name: targetType, in: path, required: true, schema: { type: string } }
      - { name: targetId, in: path, required: true, schema: { type: string } }
    get:
      summary: Audit trail for a single target (admin only).
      tags: [audit]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "400": { description: invalid cursor }
        "401": { description: not authenticated }
        "403": { description: operator admin privileges required }
  /v1/installations:
    get:
      summary: List installations, newest first.
      description: |
        An installation is a named era of the booth — one run of the art
        piece. At most one is active (`endedAt: null`) at a time, and there
        is none between an era ending and the next booth write, which opens
        one. Ending an installation does not delete anything; data keeps its
        `installationId` and stays readable under that scope.
      tags: [installations]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationList" }
        "401": { description: missing or invalid credentials }
    post:
      summary: Start a new installation.
      description: |
        Fails with 409 if an installation is still active *and* the booth has
        recorded into it — end it first. An active era with no activity yet
        (one the booth opened automatically while the operator was between
        steps) is adopted and renamed instead.

        Set `copyQuestions` to carry the last ended era's questions forward;
        copies share the original audio file so nothing is re-uploaded.
      tags: [installations]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "401": { description: missing or invalid credentials }
        "403": { description: operator is not an admin }
        "409": { description: an installation is already active and in use }

  /v1/installations/current:
    get:
      summary: The currently active installation.
      tags: [installations]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "401": { description: missing or invalid credentials }
        "404": { description: no active installation }

  /v1/installations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Fetch a single installation.
      tags: [installations]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "401": { description: missing or invalid credentials }
        "404": { description: not found }
    patch:
      summary: Edit an installation's metadata.
      tags: [installations]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationUpdate" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "401": { description: missing or invalid credentials }
        "403": { description: operator is not an admin }
        "404": { description: not found }
    delete:
      summary: Irreversibly purge an ended installation and all of its data.
      description: |
        Deletes the installation's rows and any audio blobs that no surviving
        `File` row still references, so audio shared with a later era (for
        example questions copied forward) is never orphaned.

        Refuses the active installation. The caller must echo the exact
        installation name in `confirmName` as a deliberate speed bump.
        Take an archive first — this cannot be undone.

        A recording still uploading into this era is moved to the era that is
        open rather than deleted, so the booth's completion call still lands.
        With no open era to move it to, the purge is refused.
      tags: [installations]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationPurge" }
      responses:
        "200":
          description: purged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationPurgeResult" }
        "400": { description: confirmName did not match the installation name }
        "401": { description: missing or invalid credentials }
        "403": { description: operator is not an admin }
        "404": { description: not found }
        "409":
          description: >-
            the installation is still active, or a recording is still uploading
            into it and no other era is open to receive it

  /v1/installations/{id}/end:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Close out an installation and start fresh.
      description: |
        Freezes the summary counters, closes any call sessions the booth left
        open, moves queued messages to a terminal state so the next era's
        moderation queue starts empty, and archives this era's questions.
        Nothing is deleted; the era stays readable under its own
        `installationId`, and `GET /v1/installations/{id}/export` can produce a
        scoped archive at any time.
      tags: [installations]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationEnd" }
      responses:
        "200":
          description: ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "401": { description: missing or invalid credentials }
        "403": { description: operator is not an admin }
        "404": { description: not found }
        "409": { description: installation already ended }

  /v1/installations/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Download a tar archive scoped to one installation.
      tags: [installations]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: tar archive
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "401": { description: missing or invalid credentials }
        "403": { description: operator is not an admin }
        "404": { description: not found }

  /v1/admin/data/export:
    get:
      summary: Admin-only full data + audio export (tar archive download).
      description: |
        Streams a complete backup: the Postgres data set (minus ephemeral
        OIDC sessions) plus every audio blob, bundled as a tar archive.
        See docs/backup-restore.md for the archive layout.
      tags: [admin]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: tar archive
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "401": { description: missing or invalid credentials }
        "403": { description: operator is not an admin }

  /v1/admin/data/import:
    post:
      summary: Admin-only restore of a previously exported archive.
      description: |
        Accepts a tar archive produced by the export endpoint and upserts its
        rows, uploading any audio blobs the target storage does not already
        hold. Idempotent; blob integrity is verified against SHA-256.
      tags: [admin]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: import summary
          content:
            application/json:
              schema:
                type: object
                required: [rows, blobsUploaded, blobsSkipped]
                properties:
                  rows: { type: object, additionalProperties: { type: integer } }
                  blobsUploaded: { type: integer }
                  blobsSkipped: { type: integer }
        "400": { description: empty or invalid archive }
        "401": { description: missing or invalid credentials }
        "403": { description: operator is not an admin }

  /v1/auth/login:
    get:
      summary: Begin Authentik OIDC login (Auth-Code + PKCE).
      tags: [auth]
      security: []
      responses:
        "302": { description: redirect to IdP }

  /v1/auth/callback:
    get:
      summary: OIDC callback. Validates code + sets session cookie.
      tags: [auth]
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: redirect to UI }

  /v1/auth/logout:
    post:
      summary: Clear session + RP-initiated logout.
      tags: [auth]
      security:
        - operatorSession: []
      responses:
        "302": { description: redirect to IdP logout or UI }

  /v1/auth/me:
    get:
      summary: Current operator profile (driven by ID-token claims).
      tags: [auth]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorMe" }

  /v1/api-tokens:
    get:
      summary: List active API tokens (last4 only).
      tags: [tokens]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
    post:
      summary: Issue a new API token. Returned in plaintext exactly once.
      tags: [tokens]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiTokenRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }

  /v1/api-tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Revoke an API token.
      tags: [tokens]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "204": { description: revoked }

  /v1/api-tokens/{id}/usage:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Return coarse API token usage buckets.
      tags: [tokens]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiTokenUsageBucket" }

  /v1/message-processing/summary:
    get:
      summary: Current-installation on-device processing queue counts.
      tags: [message-processing]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: Queue progress; historical installations are never included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageProcessingSummary" }

  /v1/message-processing/claim:
    post:
      summary: Atomically lease one message for an OIDC operator device.
      description: |
        Returns one hydrated, current-installation message compatible with the
        caller's local capabilities, or `claim: null` when none is available.
        Lease tokens are opaque, expire automatically, and are required by all
        follow-up writes. The lease is bound to the message's processing
        snapshot, so a result superseded by a pipeline or operator write is
        rejected rather than overwriting newer state.
      tags: [message-processing]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageProcessingClaimRequest" }
      responses:
        "200":
          description: Claimed message or an empty queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageProcessingClaimResponse" }

  /v1/message-processing/{id}/heartbeat:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Extend an active processing lease.
      tags: [message-processing]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageProcessingHeartbeat" }
      responses:
        "200": { description: lease extended }
        "409": { description: lease lost or installation ended }

  /v1/message-processing/{id}/release:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Release an active processing lease without changing the message.
      tags: [message-processing]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageProcessingLeaseToken" }
      responses:
        "204": { description: released }
        "409": { description: lease lost }

  /v1/message-processing/{id}/fail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Release a failed lease and record its safe retry state.
      description: The third failed claim is terminal and will not be re-leased automatically.
      tags: [message-processing]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageProcessingFail" }
      responses:
        "200": { description: failure recorded }
        "409": { description: lease lost }

  /v1/message-processing/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Persist a leased device's processing result set and release it.
      description: |
        Transcription, translation, moderation, and no-speech review results
        are optional parts of one atomic result set. A stale claim snapshot or
        invalid later component rejects the entire set without persisting an
        earlier component. All suggestions are advisory:
        a `likely_hangup`/`delete` review never auto-deletes a recording.
      tags: [message-processing]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageProcessingComplete" }
      responses:
        "200":
          description: Results stored; `needs` is empty when local processing is complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageProcessingCompleteResponse" }
        "409": { description: "lease lost, stale claim/input, or installation ended" }

  /v1/worker/messages/{id}/work:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Fetch push-mode work inputs for a message.
      description: |
        The `{kind:"work", needs}` WS envelope deliberately carries only the
        message id and needed steps — never a SAS URL, since `/v1/ws/status` is
        shared with browser operators. After receiving a `work` envelope the
        Transcription worker fetches the actual inputs here over its
        authenticated connection: a short-lived read-only audio SAS URL and the
        latest transcription/translation text. Read-only and claim-free.
      tags: [worker]
      security:
        - apiToken: []
      responses:
        "200":
          description: Current work inputs for the message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerWorkInput" }
        "404": { description: Message not found. }

  /v1/worker/messages/{id}/transcription:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Push-mode transcription result callback.
      description: |
        The Transcription app (macOS + iOS) transcribes booth audio and POSTs
        the text back here. Transcription is optional: a completed message is
        already `pending` in the operator review queue, so the app decides on
        its own when (or whether) to transcribe and the server never solicits
        the work. Unsolicited results are accepted — if no pending
        transcription row exists the server records a new succeeded one.
        Authenticated with a static operator-issued API token (same scheme as
        phone clients). Callbacks are claim-free (no leases); the server guards
        every write so a stale/duplicate callback cannot downgrade a finalized
        row. On success the server creates the pending moderation row and
        broadcasts the next `work` step (`translation` for non-English audio,
        else `moderation`).
      tags: [worker]
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerTranscriptionBody" }
      responses:
        "200": { description: Result accepted. }
        "404": { description: Message not found. }
        "409": { description: A newer transcription was recorded while the worker was processing. }

  /v1/worker/messages/{id}/translation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Push-mode translation result callback.
      description: |
        Pushed back after the worker translates a non-English transcript to
        English (triggered by a `{kind:"work", needs:["translation"]}`
        envelope). On success the server broadcasts the `moderation` work step.
      tags: [worker]
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerTranslationBody" }
      responses:
        "200": { description: Result accepted. }
        "404": { description: Message or transcription not found. }
        "409":
          {
            description: The transcription or its source text changed while the worker was translating.,
          }

  /v1/worker/messages/{id}/moderation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Push-mode moderation suggestion callback.
      description: |
        Pushed back after the worker moderates the (translated) transcript.
        The moderation result is only ever an ADVISORY suggestion: the server
        records it and surfaces the message in the operator review queue
        (`received` → `pending`) but never auto-approves or auto-rejects. A
        human operator always decides via `POST /v1/messages/{id}/decision`.
      tags: [worker]
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerModerationBody" }
      responses:
        "200": { description: Suggestion accepted. }
        "404": { description: Message not found. }
        "409": { description: The moderated text was superseded before the callback arrived. }

  /v1/ws/status:
    get:
      summary: WebSocket — operator UI subscribes to live status push.
      description: |
        Operator UIs subscribe over WebSocket; the server fans out a
        discriminated `{kind:"status"|"system"|"message"|"work", ...}`
        envelope. Browser clients authenticate with the operator session
        cookie; native operator clients (mobile apps, the Rust CLI) present an
        `Authorization: Bearer` Authentik access token; the push-mode
        Transcription worker (macOS + iOS) presents its static API token and
        reacts to `{kind:"work", messageId, needs}` envelopes by running the
        named steps and POSTing results to `/v1/worker/messages/{id}/*`.
        Monitor-scoped static API tokens receive only `status` and `system`
        envelopes; worker-scoped tokens receive only `work` envelopes. The
        connection is dropped with code 1009 if outbound buffering exceeds
        ~1 MiB (slow consumer guard).
      tags: [status]
      security:
        - operatorSession: []
        - operatorBearer: []
        - apiToken: []
      responses:
        "101": { description: switching protocols }
        "426": { description: upgrade required }

  /v1/events:
    post:
      summary: Bulk-ingest booth observability events (idempotent).
      description: |
        Booth → API. Events are deduplicated on `(boothId, eventId)`. Lazily
        creates a `CallSession` when `call_started` / `call_ended` events
        arrive.
      tags: [events]
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items: { $ref: "#/components/schemas/BoothEvent" }
                  minItems: 1
                  maxItems: 500
      responses:
        "200":
          description: batch accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted: { type: integer, minimum: 0 }
                  duplicates: { type: integer, minimum: 0 }
        "400": { description: invalid batch (too large or malformed) }
        "401": { description: missing or invalid API token }
    get:
      summary: List booth events (cursor-paginated).
      tags: [events]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: installationId
          in: query
          description: |
            Installation scope. Omit for the currently active installation
            (the default), pass a uuid for a historical one, or `all` to span
            every installation.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, enum: [all] }
        - name: boothId
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: type
          in: query
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        - name: sessionId
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: events page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BoothEventRecord" }
                  nextCursor:
                    type: [string, "null"]

  /v1/events/stream:
    get:
      summary: Server-Sent Events live tail of booth events.
      description: |
        Cookie-only auth (no Bearer token). The same-origin operator UI
        consumes this with `new EventSource(url, { withCredentials: true })`.
      tags: [events]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - { name: boothId, in: query, schema: { type: string } }
        - { name: sessionId, in: query, schema: { type: string, format: uuid } }
        - name: type
          in: query
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream: {}

  /v1/sessions:
    get:
      summary: List call sessions (cursor-paginated).
      tags: [sessions]
      security:
        - operatorSession: []
        - operatorBearer: []
      parameters:
        - name: installationId
          in: query
          description: |
            Installation scope. Omit for the currently active installation
            (the default), pass a uuid for a historical one, or `all` to span
            every installation.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, enum: [all] }
        - { name: boothId, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        "200":
          description: sessions page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CallSession" }
                  nextCursor:
                    type: [string, "null"]

  /v1/sessions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a single call session with its ordered events.
      tags: [sessions]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: session detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallSessionDetail" }
        "404": { description: not found }

  /v1/system:
    put:
      summary: Push the latest live system snapshot from a booth.
      description: |
        Booth → API. The operator upserts one current snapshot per booth
        and broadcasts a `{kind:"system",...}` envelope on the status WS.
        Historical metrics remain owned by VictoriaMetrics (scraped via
        vmagent); Postgres stores only the latest snapshot.
      tags: [system]
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boothId, snapshot]
              properties:
                boothId: { type: string }
                snapshot: { $ref: "#/components/schemas/BoothSystemSnapshot" }
                version:
                  description: Running `telephone-booth` Rust client version.
                  anyOf: [{ type: string, minLength: 1, maxLength: 64 }, { type: "null" }]
      responses:
        "204": { description: snapshot accepted }
        "401": { description: missing or invalid API token }

  /v1/system/current:
    get:
      summary: Get the latest persisted system snapshot for one or all booths.
      tags: [system]
      security:
        - operatorSession: []
        - operatorBearer: []
        - apiToken: []
      parameters:
        - name: boothId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: snapshot or list of snapshots
        "404": { description: no snapshot persisted for the given booth }

  /v1/devices:
    get:
      summary: List the caller's mobile devices (active only).
      tags: [devices]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MobileDevice" }
    post:
      summary: Register or refresh a mobile device APNs token for push.
      tags: [devices]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterMobileDeviceRequest" }
      responses:
        "201":
          description: registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileDevice" }

  /v1/devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update per-device notification preferences or display name.
      tags: [devices]
      security:
        - operatorSession: []
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMobileDevicePreferencesRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileDevice" }
        "404": { description: not found }
    delete:
      summary: Revoke a mobile device (stops APNs delivery to it).
      tags: [devices]
      security:
        - operatorSession: []
        - operatorBearer: []
      responses:
        "204": { description: revoked }
        "404": { description: not found }

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Phone-client API token issued from the operator UI.
    operatorSession:
      type: apiKey
      in: cookie
      name: __Host-booth_session
      description: HMAC-signed opaque session cookie set after OIDC login.
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: jwt
      description: |
        Authentik-issued JWT access token. Validated against the provider's
        JWKS, issuer, audience (operator web client_id + any configured
        `OIDC_MOBILE_AUDIENCES`), and operator group / email allow-lists.
        Used by native mobile apps that authenticate via PKCE.
  schemas:
    AuditLogEntry:
      type: object
      required:
        [
          id,
          action,
          targetType,
          targetId,
          actorType,
          actorUserId,
          actorTokenId,
          actorLabel,
          ip,
          userAgent,
          method,
          path,
          statusCode,
          metadata,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, example: message.approve }
        targetType: { type: [string, "null"], example: message }
        targetId: { type: [string, "null"] }
        actorType: { type: string, enum: [operator, apiToken, anonymous, system] }
        actorUserId: { type: [string, "null"] }
        actorTokenId: { type: [string, "null"] }
        actorLabel:
          type: string
          description: |
            Human-readable actor snapshot taken at write time (operator email,
            or `token:<name>`). Survives deletion of the referenced row.
        ip: { type: [string, "null"] }
        userAgent: { type: [string, "null"] }
        method: { type: string, example: POST }
        path: { type: string, example: "/v1/messages/{id}/decision" }
        statusCode: { type: integer }
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Action-specific detail. Never contains secrets or SAS URLs.
        createdAt: { type: string, format: date-time }
    AuditLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        nextCursor: { type: [string, "null"] }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        time: { type: string, format: date-time }
    WorkerWorkInput:
      type: object
      required: [id, status, audio, transcription]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        audio:
          oneOf:
            - type: "null"
            - type: object
              required: [url, sha256, filename]
              properties:
                url: { type: string, description: "Short-lived read-only audio SAS URL." }
                sha256: { type: string }
                durationMs: { type: [integer, "null"] }
                contentType: { type: [string, "null"] }
                filename: { type: string }
        transcription:
          oneOf:
            - type: "null"
            - type: object
              required: [id, text, translationInputSha256, moderationText, moderationInputSha256]
              properties:
                id: { type: string, format: uuid }
                text: { type: string }
                language: { type: [string, "null"] }
                model: { type: [string, "null"] }
                translationStatus: { type: [string, "null"] }
                translatedText: { type: [string, "null"] }
                translationInputSha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: "SHA-256 of the ECMAScript-trimmed transcript; translation callbacks must return it."
                moderationText:
                  type: string
                  description: "Text the moderation step should score (English translation when available, else the transcript)."
                moderationInputSha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: "SHA-256 of moderationText; new workers should return it with the verdict."
    WorkerTranscriptionBody:
      type: object
      required: [text]
      properties:
        transcriptionId: { type: [string, "null"], format: uuid }
        expectedLatestTranscriptionId: { type: [string, "null"], format: uuid }
        text: { type: string }
        language: { type: [string, "null"] }
        model: { type: [string, "null"] }
    WorkerTranslationBody:
      type: object
      required: [transcriptionId, inputSha256, translatedText]
      properties:
        transcriptionId: { type: string, format: uuid }
        inputSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        translatedText: { type: string }
        sourceLanguage: { type: [string, "null"] }
        targetLanguage: { type: [string, "null"] }
        model: { type: [string, "null"] }
    WorkerModerationBody:
      type: object
      required: [flagged, recommendation, maxScore]
      oneOf:
        - properties:
            transcriptionId: { type: "null" }
            inputSha256: false
        - required: [transcriptionId, inputSha256]
          properties:
            transcriptionId: { type: string, format: uuid }
            inputSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      properties:
        transcriptionId: { type: [string, "null"], format: uuid }
        inputSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        flagged: { type: boolean }
        recommendation: { type: string, enum: [approve, review, reject] }
        maxScore: { type: number, minimum: 0, maximum: 1 }
        categories:
          type: object
          additionalProperties: { type: number }
        reasonSummary: { type: string }
        model: { type: [string, "null"] }
    BoothState:
      type: string
      enum:
        [
          idle,
          dialTone,
          dialing,
          playingQuestion,
          beep,
          recording,
          uploading,
          playingMessage,
          playingInstructions,
          callUnavailable,
          error,
        ]
    BoothStatus:
      type: object
      required: [state, updatedAt]
      properties:
        id:
          type: integer
          description: >-
            Snapshot row id. Two runs of the same status can share a booth
            timestamp, so clients use this to tell rows apart; it increases with
            insertion order.
        state: { $ref: "#/components/schemas/BoothState" }
        updatedAt: { type: string, format: date-time }
        firstSeenAt:
          type: string
          format: date-time
          description: >-
            First time the booth reported this status. Identical consecutive
            reports (heartbeats) are collapsed into one snapshot spanning
            firstSeenAt..updatedAt.
        repeatCount:
          type: integer
          minimum: 1
          description: Number of identical booth reports collapsed into this snapshot.
        currentQuestionId: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
        currentMessageId: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
        lastError: { anyOf: [{ type: string }, { type: "null" }] }
        runtimeMode:
          anyOf:
            - { type: string, enum: [real, mock, simulator] }
            - { type: "null" }
          description: >-
            How the booth is being driven. Part of the status identity, so a
            change here starts a new snapshot rather than collapsing into the
            current one.
    StatusUpdate:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/BoothState" }
        updatedAt: { type: string, format: date-time }
        currentQuestionId: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
        currentMessageId: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
        lastError: { anyOf: [{ type: string }, { type: "null" }] }
        runtimeMode:
          anyOf:
            - { type: string, enum: [real, mock, simulator] }
            - { type: "null" }
          description: >-
            How the booth is being driven. Part of the status identity, so a
            change here starts a new snapshot rather than collapsing into the
            current one.
    StatusHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BoothStatus" }
    Sha256:
      type: string
      pattern: "^[a-f0-9]{64}$"
    Bcp47LanguageTag:
      type: string
      minLength: 1
      maxLength: 64
      format: bcp47
      description: >-
        RFC 5646 / BCP-47 language tag, including registered extensions and
        private-use tags. The API returns its canonical casing.
    AudioRef:
      type: object
      required: [url, sha256, durationMs]
      properties:
        url: { type: string, format: uri, description: "Time-bounded read URL." }
        sha256: { $ref: "#/components/schemas/Sha256" }
        durationMs: { anyOf: [{ type: integer, minimum: 1 }, { type: "null" }] }
    Question:
      type: object
      required: [id, prompt, status, createdAt, audio]
      properties:
        id: { type: string, format: uuid }
        prompt: { type: string, minLength: 1, maxLength: 280 }
        status: { $ref: "#/components/schemas/QuestionStatus" }
        createdAt: { type: string, format: date-time }
        audio: { $ref: "#/components/schemas/AudioRef" }
    QuestionStatus:
      type: string
      enum: [draft, active, archived]
    QuestionCreate:
      type: object
      required: [prompt, audioFileId]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 280 }
        audioFileId: { type: string, format: uuid }
        status:
          allOf:
            - $ref: "#/components/schemas/QuestionStatus"
          description: Defaults to draft when omitted.
    QuestionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        nextCursor: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
    Instruction:
      type: object
      required: [id, description, status, createdAt, audio]
      properties:
        id: { type: string, format: uuid }
        description: { anyOf: [{ type: string, maxLength: 280 }, { type: "null" }] }
        status: { $ref: "#/components/schemas/InstructionStatus" }
        createdAt: { type: string, format: date-time }
        audio: { $ref: "#/components/schemas/AudioRef" }
    InstructionStatus:
      type: string
      enum: [active, inactive]
    InstructionCreate:
      type: object
      required: [audioFileId]
      properties:
        description: { type: string, maxLength: 280 }
        audioFileId: { type: string, format: uuid }
        status:
          allOf:
            - $ref: "#/components/schemas/InstructionStatus"
          description: Defaults to active when omitted.
    InstructionUpdate:
      type: object
      required: [description]
      properties:
        description: { anyOf: [{ type: string, maxLength: 280 }, { type: "null" }] }
    InstructionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Instruction" }
        nextCursor: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
    MessageStatus:
      type: string
      enum: [uploading, received, pending, approved, rejected]
    Message:
      type: object
      required: [id, status, createdAt, audio]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MessageStatus" }
        installationId: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
        questionId: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
        notes: { anyOf: [{ type: string }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        receivedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        decidedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        decidedById: { anyOf: [{ type: string }, { type: "null" }] }
        reviewClassification:
          anyOf:
            - { type: string, enum: [likely_hangup, unclear] }
            - { type: "null" }
        reviewRecommendation:
          anyOf:
            - { type: string, enum: [delete, review] }
            - { type: "null" }
        reviewClassifiedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        reviewClassifiedById: { anyOf: [{ type: string }, { type: "null" }] }
        audio: { $ref: "#/components/schemas/AudioRef" }
        latestTranscription:
          anyOf:
            - $ref: "#/components/schemas/Transcription"
            - { type: "null" }
        latestModeration:
          anyOf:
            - $ref: "#/components/schemas/Moderation"
            - { type: "null" }
    MessageCreate:
      type: object
      required: [durationMs, sha256]
      properties:
        questionId: { type: string, format: uuid }
        durationMs: { type: integer, minimum: 1, maximum: 300000 }
        sha256: { $ref: "#/components/schemas/Sha256" }
    MessageInitiated:
      type: object
      required: [id, uploadUrl, blobName]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        blobName: { type: string }
    MessageComplete:
      type: object
      required: [id, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [uploading, received, pending, approved, rejected]
          description: >
            Status after the transition. A newly completed upload is
            `pending`; other values only occur on an idempotent replay of a
            message that already advanced.
        receivedAt: { type: string, format: date-time }
    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
    MessageProcessingClaimRequest:
      type: object
      properties:
        capabilities:
          type: array
          items: { type: string, enum: [transcription, translation, moderation, review] }
          default: [transcription, translation, moderation, review]
        leaseSeconds: { type: integer, minimum: 30, maximum: 900, default: 300 }
    MessageProcessingSummary:
      type: object
      required: [queued, leased, terminal, needs, generatedAt]
      properties:
        queued: { type: integer, minimum: 0 }
        leased: { type: integer, minimum: 0 }
        terminal: { type: integer, minimum: 0 }
        needs:
          type: object
          required: [transcription, translation, moderation, review]
          properties:
            transcription: { type: integer, minimum: 0 }
            translation: { type: integer, minimum: 0 }
            moderation: { type: integer, minimum: 0 }
            review: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
    MessageProcessingClaim:
      type: object
      required: [message, needs, leaseToken, leaseExpiresAt, defaultTranscriptionLanguage]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        needs:
          type: array
          minItems: 1
          items: { type: string, enum: [transcription, translation, moderation, review] }
        leaseToken: { type: string, minLength: 32 }
        leaseExpiresAt: { type: string, format: date-time }
        defaultTranscriptionLanguage:
          anyOf:
            - $ref: "#/components/schemas/Bcp47LanguageTag"
            - { type: "null" }
    MessageProcessingClaimResponse:
      type: object
      required: [claim]
      properties:
        claim:
          anyOf:
            - $ref: "#/components/schemas/MessageProcessingClaim"
            - { type: "null" }
    MessageProcessingLeaseToken:
      type: object
      required: [leaseToken]
      properties:
        leaseToken: { type: string, minLength: 32 }
    MessageProcessingHeartbeat:
      allOf:
        - $ref: "#/components/schemas/MessageProcessingLeaseToken"
        - type: object
          properties:
            leaseSeconds: { type: integer, minimum: 30, maximum: 900, default: 300 }
    MessageProcessingFail:
      allOf:
        - $ref: "#/components/schemas/MessageProcessingLeaseToken"
        - type: object
          required: [errorCode]
          properties:
            errorCode: { type: string, minLength: 1, maxLength: 128 }
            errorMessage: { type: string, maxLength: 2000 }
    MessageProcessingComplete:
      allOf:
        - $ref: "#/components/schemas/MessageProcessingLeaseToken"
        - type: object
          minProperties: 2
          properties:
            transcription:
              type: object
              required: [text]
              properties:
                expectedLatestTranscriptionId: { type: [string, "null"], format: uuid }
                expectedLatestTranscriptionSha256:
                  { type: [string, "null"], pattern: "^[0-9a-fA-F]{64}$" }
                text: { type: string, maxLength: 20000 }
                language: { type: [string, "null"], maxLength: 64 }
                model: { type: [string, "null"], maxLength: 128 }
            translation:
              type: object
              required: [translatedText]
              properties:
                transcriptionId: { type: string, format: uuid }
                expectedTranslationSha256: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
                translatedText: { type: string, minLength: 1, maxLength: 20000 }
                translatedLanguage: { $ref: "#/components/schemas/Bcp47LanguageTag" }
                model: { type: [string, "null"], maxLength: 128 }
            moderation:
              type: object
              required: [flagged, recommendation, maxScore]
              properties:
                inputSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                flagged: { type: boolean }
                recommendation: { $ref: "#/components/schemas/ModerationRecommendation" }
                maxScore: { type: number, minimum: 0, maximum: 1 }
                categories: { type: object, additionalProperties: { type: number } }
                reasonSummary: { type: [string, "null"], maxLength: 2000 }
                model: { type: [string, "null"], maxLength: 128 }
            review:
              type: object
              required: [classification, recommendation]
              properties:
                classification: { type: string, enum: [likely_hangup, unclear] }
                recommendation: { type: string, enum: [delete, review] }
    MessageProcessingCompleteResponse:
      type: object
      required: [message, needs]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        needs:
          type: array
          items: { type: string, enum: [transcription, translation, moderation, review] }
    UploadSasRequest:
      type: object
      required: [kind, sha256, sizeBytes, contentType]
      properties:
        kind: { type: string, enum: [message, question-audio, instruction-audio] }
        sha256: { $ref: "#/components/schemas/Sha256" }
        sizeBytes: { type: integer, minimum: 1 }
        contentType:
          {
            type: string,
            enum:
              [
                audio/flac,
                audio/wav,
                audio/x-wav,
                audio/aiff,
                audio/x-aiff,
                audio/mpeg,
                audio/mp4,
                audio/x-m4a,
                audio/ogg,
              ],
          }
    UploadSlot:
      type: object
      required: [uploadUrl, blobName, expiresAt]
      properties:
        uploadUrl: { type: string, format: uri, description: "Azure Blob PUT URL with SAS." }
        blobName: { type: string }
        expiresAt: { type: string, format: date-time }
        audioFileId:
          {
            type: string,
            format: uuid,
            description: "Present for question/instruction audio uploads.",
          }
    OperatorMe:
      type: object
      required: [id, name, email, groups, isAdmin, providerName]
      properties:
        id: { type: string, description: "Stable Authentik sub" }
        name: { type: string }
        email: { type: string, format: email }
        groups:
          type: array
          items: { type: string }
        isAdmin:
          type: boolean
          description: "True when the operator is in an admin group (OIDC_ADMIN_GROUPS). Admins may manage questions and run data export/import."
        picture: { type: string, format: uri }
        providerName: { type: string, description: "OIDC_PROVIDER_NAME — drives UI copy." }
    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scope:
          type: string
          enum: [operator, worker, monitor]
          default: operator
          description: >-
            Capability scope. "operator" (default) authenticates booth/phone and
            native operator clients; "worker" is limited to the push-worker
            callback routes and receives only `work` events on the status
            WebSocket; "monitor" is limited to read-only status/system routes
            and receives only those envelopes.
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
    ApiToken:
      type: object
      required: [id, name, scope, last4, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [operator, worker, monitor] }
        last4: { type: string, minLength: 4, maxLength: 4 }
        createdAt: { type: string, format: date-time }
        expiresAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        lastUsedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        revokedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [plaintext]
          properties:
            plaintext:
              type: string
              description: "Plaintext token. Shown ONLY on creation. Store securely."
    ApiTokenUsageBucket:
      type: object
      required: [date, count]
      properties:
        date: { type: string }
        count: { type: integer, minimum: 0 }
    BoothEventType:
      type: string
      enum:
        - call_started
        - call_ended
        - digit_dialed
        - state_transition
        - recording_started
        - recording_stopped
        - upload_started
        - upload_completed
        - upload_failed
        - gpio_edge
        - audio_device_change
        - operator_request
        - operator_response
        - error
        - log
        - system_sample
    CallOutcome:
      type: string
      description: >-
        What the booth reported, or `installation_ended`, which the API writes
        on calls that were still open when an installation ended. Booth clients
        cannot send `installation_ended`.
      enum:
        - hung_up_before_dial
        - hung_up_during_prompt
        - hung_up_during_recording
        - hung_up_during_upload
        - recording_completed
        - recording_failed
        - upload_failed
        - operator_error
        - aborted
        - installation_ended
    BoothEvent:
      type: object
      required: [eventId, boothId, bootId, type, occurredAt]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 128 }
        boothId: { type: string, minLength: 1, maxLength: 64 }
        bootId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/BoothEventType" }
        occurredAt: { type: string, format: date-time }
        sessionId: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
        recordingId: { anyOf: [{ type: string }, { type: "null" }] }
        payload: {}
        version:
          description: Running `telephone-booth` Rust client version (e.g. `0.3.2`).
          anyOf: [{ type: string, minLength: 1, maxLength: 64 }, { type: "null" }]
    BoothEventRecord:
      allOf:
        - $ref: "#/components/schemas/BoothEvent"
        - type: object
          required: [id, receivedAt]
          properties:
            id: { type: string }
            receivedAt: { type: string, format: date-time }
    CallSession:
      type: object
      required:
        [
          id,
          boothId,
          bootId,
          startedAt,
          endedAt,
          digitsDialed,
          outcome,
          recordingId,
          durationMs,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        boothId: { type: string }
        bootId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        digitsDialed: { anyOf: [{ type: string }, { type: "null" }] }
        outcome:
          anyOf:
            - $ref: "#/components/schemas/CallOutcome"
            - { type: "null" }
        recordingId: { anyOf: [{ type: string }, { type: "null" }] }
        durationMs: { anyOf: [{ type: integer, minimum: 0 }, { type: "null" }] }
        version:
          description: Booth client version snapshot captured from the `call_started` event.
          anyOf: [{ type: string, minLength: 1, maxLength: 64 }, { type: "null" }]
    CallSessionDetail:
      allOf:
        - $ref: "#/components/schemas/CallSession"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/BoothEventRecord" }
    BoothSystemSnapshot:
      type: object
      description: |
        Forward-compatible snapshot of host vitals. Mirrors the Rust
        `booth-hal::SystemSnapshot` struct as emitted on the wire (camelCase).
        Every top-level snapshot field is optional, and unknown extra keys are
        preserved end-to-end so new metrics roll out without breaking older
        operator builds. Note that disk and network *entries* still require
        their identifying field (`mountPoint` / `interface`) and core counters
        — see `BoothDiskStats` / `BoothNetworkStats` below — because an entry
        without those would carry no signal. Adapters that can't supply them
        should omit the entry rather than emit a partial one.
      additionalProperties: true
      properties:
        temperatureCelsius: { type: [number, "null"] }
        uptimeSeconds: { type: [number, "null"], minimum: 0 }
        runtimeMode:
          anyOf:
            - { type: string, enum: [real, mock, simulator] }
            - type: "null"
        cpu:
          anyOf: [{ $ref: "#/components/schemas/BoothCpuStats" }, { type: "null" }]
        memory:
          anyOf: [{ $ref: "#/components/schemas/BoothMemoryStats" }, { type: "null" }]
        disks:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/BoothDiskStats" }
        networks:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/BoothNetworkStats" }
        process:
          anyOf: [{ $ref: "#/components/schemas/BoothProcessStats" }, { type: "null" }]
        audio:
          anyOf: [{ $ref: "#/components/schemas/BoothAudioStats" }, { type: "null" }]
        tailscale:
          anyOf: [{ $ref: "#/components/schemas/BoothTailscaleStats" }, { type: "null" }]
        fan:
          anyOf: [{ $ref: "#/components/schemas/BoothFanStats" }, { type: "null" }]
        throttling:
          anyOf: [{ $ref: "#/components/schemas/BoothThrottlingFlags" }, { type: "null" }]
    BoothCpuStats:
      type: object
      additionalProperties: true
      properties:
        usageRatio: { type: [number, "null"], minimum: 0, maximum: 1 }
        perCoreUsageRatio:
          type: [array, "null"]
          items: { type: number, minimum: 0, maximum: 1 }
        physicalCores: { type: [integer, "null"], minimum: 0 }
        loadAvg1m: { type: [number, "null"] }
        loadAvg5m: { type: [number, "null"] }
        loadAvg15m: { type: [number, "null"] }
    BoothMemoryStats:
      type: object
      additionalProperties: true
      properties:
        totalBytes: { type: [number, "null"], minimum: 0 }
        usedBytes: { type: [number, "null"], minimum: 0 }
        swapTotalBytes: { type: [number, "null"], minimum: 0 }
        swapUsedBytes: { type: [number, "null"], minimum: 0 }
    BoothDiskStats:
      type: object
      additionalProperties: true
      required: [mountPoint, totalBytes, availableBytes]
      properties:
        mountPoint: { type: string }
        filesystem: { type: [string, "null"] }
        totalBytes: { type: number, minimum: 0 }
        availableBytes: { type: number, minimum: 0 }
    BoothNetworkStats:
      type: object
      additionalProperties: true
      required: [interface, receiveBytesTotal, transmitBytesTotal]
      properties:
        interface: { type: string }
        receiveBytesTotal: { type: number, minimum: 0 }
        transmitBytesTotal: { type: number, minimum: 0 }
        addresses:
          type: array
          items: { type: string }
          description: IP addresses bound to this interface (IPv4 and IPv6).
    BoothProcessStats:
      type: object
      additionalProperties: true
      properties:
        residentBytes: { type: [number, "null"], minimum: 0 }
        virtualBytes: { type: [number, "null"], minimum: 0 }
        openFds: { type: [number, "null"], minimum: 0 }
        threads: { type: [number, "null"], minimum: 0 }
        uptimeSeconds: { type: [number, "null"], minimum: 0 }
    BoothAudioStats:
      type: object
      additionalProperties: true
      properties:
        inputDevice: { type: [string, "null"] }
        outputDevice: { type: [string, "null"] }
        sampleRateHz: { type: [integer, "null"], minimum: 0 }
    BoothTailscaleStats:
      type: object
      additionalProperties: true
      properties:
        connected: { type: [boolean, "null"] }
        peerCount: { type: [integer, "null"], minimum: 0 }
        hostname: { type: [string, "null"] }
        exitNode: { type: [string, "null"] }
    BoothFanStats:
      type: object
      description: |
        PWM cooling-fan state. `commandedOn` and `pwmRatio` describe the
        kernel request; `rpm` is measured rotor speed and is omitted when no
        tachometer feedback is available.
      additionalProperties: true
      properties:
        commandedOn: { type: [boolean, "null"] }
        pwmRatio: { type: [number, "null"], minimum: 0, maximum: 1 }
        rpm: { type: [integer, "null"], minimum: 0 }
        coolingState: { type: [integer, "null"], minimum: 0 }
        maxCoolingState: { type: [integer, "null"], minimum: 0 }
    BoothThrottlingFlags:
      type: object
      additionalProperties: true
      properties:
        undervoltage: { type: [boolean, "null"] }
        armFreqCapped: { type: [boolean, "null"] }
        throttled: { type: [boolean, "null"] }
        softTempLimit: { type: [boolean, "null"] }
        undervoltageOccurred: { type: [boolean, "null"] }
        throttledOccurred: { type: [boolean, "null"] }
    TranscriptionStatus:
      type: string
      enum: [pending, succeeded, failed]
    ModerationRecommendation:
      type: string
      enum: [approve, review, reject]
    AiProvider:
      type: string
      enum: [openai, mac_app, push, on_device, disabled]
    Transcription:
      type: object
      required: [id, messageId, provider, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/AiProvider" }
        model: { anyOf: [{ type: string }, { type: "null" }] }
        status: { $ref: "#/components/schemas/TranscriptionStatus" }
        text: { anyOf: [{ type: string }, { type: "null" }] }
        language: { anyOf: [{ type: string }, { type: "null" }] }
        durationMs: { anyOf: [{ type: integer, minimum: 0 }, { type: "null" }] }
        latencyMs: { anyOf: [{ type: integer, minimum: 0 }, { type: "null" }] }
        error: { anyOf: [{ type: string }, { type: "null" }] }
        requestedById: { anyOf: [{ type: string }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        completedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    Moderation:
      type: object
      required: [id, messageId, provider, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        transcriptionId: { anyOf: [{ type: string, format: uuid }, { type: "null" }] }
        provider: { $ref: "#/components/schemas/AiProvider" }
        model: { anyOf: [{ type: string }, { type: "null" }] }
        status: { $ref: "#/components/schemas/TranscriptionStatus" }
        flagged: { anyOf: [{ type: boolean }, { type: "null" }] }
        recommendation:
          anyOf:
            - $ref: "#/components/schemas/ModerationRecommendation"
            - { type: "null" }
        maxScore: { anyOf: [{ type: number, minimum: 0, maximum: 1 }, { type: "null" }] }
        categories:
          { anyOf: [{ type: object, additionalProperties: { type: number } }, { type: "null" }] }
        reasonSummary: { anyOf: [{ type: string }, { type: "null" }] }
        latencyMs: { anyOf: [{ type: integer, minimum: 0 }, { type: "null" }] }
        error: { anyOf: [{ type: string }, { type: "null" }] }
        requestedById: { anyOf: [{ type: string }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        completedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    TranscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transcription" }
    StatsSummary:
      type: object
      required: [booth, messages, calls, realtime, generatedAt]
      properties:
        booth: { $ref: "#/components/schemas/BoothStatus" }
        messages:
          type: object
          required: [pending, awaitingModeration, receivedToday, latestId]
          properties:
            pending: { type: integer, minimum: 0 }
            awaitingModeration:
              type: integer
              minimum: 0
              description: >
                Messages awaiting operator moderation (status "received" or
                "pending"). Drives the mobile app-icon / tab badge.
            receivedToday: { type: integer, minimum: 0 }
            latestId:
              anyOf:
                - { type: string, format: uuid }
                - { type: "null" }
        calls:
          type: object
          required: [today, inProgress]
          properties:
            today: { type: integer, minimum: 0 }
            inProgress: { type: integer, minimum: 0 }
        realtime:
          type: object
          required: [wsClients]
          properties:
            wsClients: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
    MonitorSummary:
      type: object
      required:
        [callsToday, messagesToday, callsTotal, messagesTotal, dayStartedAt, generatedAt, timeZone]
      properties:
        callsToday: { type: integer, minimum: 0 }
        messagesToday: { type: integer, minimum: 0 }
        callsTotal: { type: integer, minimum: 0 }
        messagesTotal: { type: integer, minimum: 0 }
        dayStartedAt: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
    Installation:
      type: object
      required:
        [
          id,
          name,
          notes,
          location,
          defaultTranscriptionLanguage,
          startedAt,
          endedAt,
          endedById,
          summary,
          createdAt,
          isActive,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: [string, "null"] }
        location: { type: [string, "null"] }
        defaultTranscriptionLanguage:
          anyOf:
            - $ref: "#/components/schemas/Bcp47LanguageTag"
            - { type: "null" }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        endedById: { type: [string, "null"] }
        summary:
          oneOf:
            - $ref: "#/components/schemas/InstallationSummary"
            - type: "null"
          description: Frozen at end time; null while the installation is active.
        createdAt: { type: string, format: date-time }
        isActive: { type: boolean }

    InstallationSummary:
      type: object
      description: Counters frozen when the installation was ended.
      required:
        [
          calls,
          messages,
          allRecordings,
          byStatus,
          messagesApproved,
          messagesRejected,
          questions,
          events,
          recordedMs,
          firstActivityAt,
          lastActivityAt,
        ]
      properties:
        calls: { type: integer, minimum: 0 }
        messages: { type: integer, minimum: 0 }
        allRecordings: { type: integer, minimum: 0 }
        byStatus: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        messagesApproved: { type: integer, minimum: 0 }
        messagesRejected: { type: integer, minimum: 0 }
        questions: { type: integer, minimum: 0 }
        events: { type: integer, minimum: 0 }
        recordedMs: { type: integer, minimum: 0 }
        firstActivityAt: { type: [string, "null"], format: date-time }
        lastActivityAt: { type: [string, "null"], format: date-time }

    InstallationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Installation" }

    InstallationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: [string, "null"], maxLength: 2000 }
        location: { type: [string, "null"], maxLength: 200 }
        defaultTranscriptionLanguage:
          anyOf:
            - $ref: "#/components/schemas/Bcp47LanguageTag"
            - { type: "null" }
        copyQuestions:
          type: boolean
          default: false
          description: |
            Carry the previous installation's questions forward. The copies
            point at the same audio blob, so nothing is re-uploaded.

    InstallationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: [string, "null"], maxLength: 2000 }
        location: { type: [string, "null"], maxLength: 200 }
        defaultTranscriptionLanguage:
          anyOf:
            - $ref: "#/components/schemas/Bcp47LanguageTag"
            - { type: "null" }

    InstallationEnd:
      type: object
      description: Optional metadata edits applied while closing the books.
      properties:
        notes: { type: [string, "null"], maxLength: 2000 }
        location: { type: [string, "null"], maxLength: 200 }

    InstallationPurge:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string
          description: Must exactly match the installation's name.

    InstallationPurgeResult:
      type: object
      required: [installationId, rows, blobsDeleted, blobsRetained, blobFailures]
      properties:
        installationId: { type: string, format: uuid }
        rows: { type: object, additionalProperties: { type: integer } }
        blobsDeleted: { type: integer, minimum: 0 }
        blobsRetained:
          type: integer
          minimum: 0
          description: Blobs kept because a surviving File row still references them.
        blobFailures:
          type: array
          items: { type: string }

    MetricFilter:
      type: object
      required: [id, name, window, start, end, createdAt, updatedAt]
      description: >
        A per-operator saved metrics time selection. Either `window` (a preset)
        is set, or a custom range via `start`/`end`. A null `end` means "now".
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        window:
          anyOf:
            - { $ref: "#/components/schemas/StatsWindow" }
            - { type: "null" }
        start: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        end: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StatsWindow:
      type: string
      enum: [24h, 7d, 30d, all]
    MetricFilterInput:
      type: object
      required: [name, window]
      description: >
        Create/update payload for a saved filter. `window` is required: a preset
        value selects that window (and forbids start/end), while `null` means a
        custom range qualified by the optional start/end bounds (null =
        open-ended). A preset window and a range are mutually exclusive.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        window:
          anyOf:
            - { $ref: "#/components/schemas/StatsWindow" }
            - { type: "null" }
        start: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        end: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    StatsOverview:
      type: object
      description: Historical usage aggregation for a preset window or custom range.
      required:
        [
          window,
          rangeStart,
          rangeEnd,
          generatedAt,
          timezone,
          calls,
          messages,
          playback,
          pickupsHangups,
          uploads,
          topQuestions,
          hourly,
          busiest,
          lastActivityAt,
          boothBreakdown,
        ]
      properties:
        window:
          anyOf:
            - { $ref: "#/components/schemas/StatsWindow" }
            - { type: string, enum: [custom] }
        rangeStart: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        rangeEnd: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        timezone: { type: string, enum: [UTC] }
        calls:
          type: object
          required:
            [total, completed, inProgress, averageDurationMs, longestDurationMs, outcomes, perDay]
          properties:
            total: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            inProgress: { type: integer, minimum: 0 }
            averageDurationMs: { anyOf: [{ type: number, minimum: 0 }, { type: "null" }] }
            longestDurationMs: { anyOf: [{ type: number, minimum: 0 }, { type: "null" }] }
            outcomes:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
            perDay:
              type: array
              items:
                type: object
                required: [date, total, completed]
                properties:
                  date: { type: string }
                  total: { type: integer, minimum: 0 }
                  completed: { type: integer, minimum: 0 }
        messages:
          type: object
          required: [total, approved, allRecordings, byStatus, averageDurationMs]
          properties:
            total:
              type: integer
              minimum: 0
              description: Approved/playable messages; retained for compatibility.
            approved: { type: integer, minimum: 0 }
            allRecordings: { type: integer, minimum: 0 }
            byStatus:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
            averageDurationMs: { anyOf: [{ type: number, minimum: 0 }, { type: "null" }] }
        playback:
          type: object
          required: [totalPlaybacks]
          properties:
            totalPlaybacks: { type: integer, minimum: 0 }
        pickupsHangups:
          type: object
          required: [pickups, hangups, digitsDialed]
          properties:
            pickups: { type: integer, minimum: 0 }
            hangups: { type: integer, minimum: 0 }
            digitsDialed:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
        uploads:
          type: object
          required: [succeeded, failed, failureRate]
          properties:
            succeeded: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            failureRate: { anyOf: [{ type: number, minimum: 0, maximum: 1 }, { type: "null" }] }
        topQuestions:
          type: array
          items:
            type: object
            required: [questionId, prompt, messageCount, lastUsedAt, retiredAt]
            properties:
              questionId: { type: string, format: uuid }
              prompt: { type: string }
              messageCount: { type: integer, minimum: 0 }
              lastUsedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
              retiredAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        hourly:
          type: array
          items:
            type: object
            required: [hour, calls, messages]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              calls: { type: integer, minimum: 0 }
              messages: { type: integer, minimum: 0 }
        busiest:
          type: object
          required: [hour, dayOfWeek]
          properties:
            hour: { anyOf: [{ type: integer, minimum: 0, maximum: 23 }, { type: "null" }] }
            dayOfWeek: { anyOf: [{ type: integer, minimum: 0, maximum: 6 }, { type: "null" }] }
        lastActivityAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        boothBreakdown:
          type: array
          items:
            type: object
            required: [boothId, calls, messages, lastSeenAt]
            properties:
              boothId: { type: string }
              calls: { type: integer, minimum: 0 }
              messages: { anyOf: [{ type: integer, minimum: 0 }, { type: "null" }] }
              lastSeenAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    MobileDevicePlatform:
      type: string
      enum: [ios, ipados, macos, watchos, visionos, tvos]
    MobileDevicePreferences:
      type: object
      required: [callStarted, messageReceived, messageFlagged, moderationQueueHigh]
      properties:
        callStarted: { type: boolean }
        messageReceived: { type: boolean }
        messageFlagged: { type: boolean }
        moderationQueueHigh: { type: boolean }
    MobileDevice:
      type: object
      required: [id, apnsToken, platform, preferences, registeredAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        apnsToken: { type: string, minLength: 32 }
        platform: { $ref: "#/components/schemas/MobileDevicePlatform" }
        deviceName: { anyOf: [{ type: string }, { type: "null" }] }
        preferences: { $ref: "#/components/schemas/MobileDevicePreferences" }
        registeredAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    RegisterMobileDeviceRequest:
      type: object
      required: [apnsToken, platform]
      properties:
        apnsToken: { type: string, minLength: 32 }
        platform: { $ref: "#/components/schemas/MobileDevicePlatform" }
        deviceName: { type: string }
        preferences:
          type: object
          properties:
            callStarted: { type: boolean }
            messageReceived: { type: boolean }
            messageFlagged: { type: boolean }
            moderationQueueHigh: { type: boolean }
    UpdateMobileDevicePreferencesRequest:
      type: object
      properties:
        deviceName: { anyOf: [{ type: string }, { type: "null" }] }
        preferences:
          type: object
          properties:
            callStarted: { type: boolean }
            messageReceived: { type: boolean }
            messageFlagged: { type: boolean }
            moderationQueueHigh: { type: boolean }
